name: Build and benchmark MicroScale

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profiles:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    name: ${{ matrix.profile }} ARM64 + native benchmark
    strategy:
      fail-fast: false
      matrix:
        profile: [small, micro, extreme]
    steps:
      - name: Checkout MicroScale
        uses: actions/checkout@v4

      - name: Script and pin tests
        run: bash tests/test_profiles.sh

      - name: Verify interactive binary-only installer
        run: bash tests/test_installer.sh

      - name: Validate RAM test and report importer
        run: bash tests/test_ram.sh

      - name: Check manager lifecycle and checksum pin
        run: bash tests/test_manager.sh

      - name: Test RAM-stage lifecycle and NAND apply gating
        run: bash tests/test_ram_stage.sh

      - name: Install benchmark tools and packer
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y binutils time
          if [ "${{ matrix.profile }}" = extreme ]; then
            sudo apt-get install -y upx-ucl
          fi

      - name: Build Linux ARM64
        run: TARGET_GOARCH=arm64 bash scripts/build.sh "${{ matrix.profile }}"

      - name: Verify Linux ARM64 (static only)
        run: bash scripts/verify.sh "dist/${{ matrix.profile }}/linux-arm64/microscale" arm64

      - name: Benchmark ARM64 executable size
        run: bash scripts/benchmark.sh "${{ matrix.profile }}" arm64 "dist/${{ matrix.profile }}/linux-arm64/microscale"

      - name: Build Linux AMD64 for native CLI and daemon smoke checks
        run: TARGET_GOARCH=amd64 bash scripts/build.sh "${{ matrix.profile }}"

      - name: Verify native CLI and daemon
        run: bash scripts/verify.sh "dist/${{ matrix.profile }}/linux-amd64/microscale" amd64

      - name: Benchmark native runtime (NOT NR3053)
        run: bash scripts/benchmark.sh "${{ matrix.profile }}" amd64 "dist/${{ matrix.profile }}/linux-amd64/microscale"

      - name: Summary
        shell: bash
        run: |
          echo "### ${{ matrix.profile }} — CI runner, not router qualification" >> "$GITHUB_STEP_SUMMARY"
          echo '#### ARM64' >> "$GITHUB_STEP_SUMMARY"
          echo '~~~' >> "$GITHUB_STEP_SUMMARY"
          cat "dist/${{ matrix.profile }}/linux-arm64/benchmark.tsv" >> "$GITHUB_STEP_SUMMARY"
          echo '~~~' >> "$GITHUB_STEP_SUMMARY"
          echo '#### AMD64' >> "$GITHUB_STEP_SUMMARY"
          echo '~~~' >> "$GITHUB_STEP_SUMMARY"
          cat "dist/${{ matrix.profile }}/linux-amd64/benchmark.tsv" >> "$GITHUB_STEP_SUMMARY"
          echo '~~~' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload binaries and benchmarks
        uses: actions/upload-artifact@v4
        with:
          name: microscale-${{ matrix.profile }}-builds
          path: |
            dist/${{ matrix.profile }}/linux-arm64/
            dist/${{ matrix.profile }}/linux-amd64/
          if-no-files-found: error
          retention-days: 30

name: MicroScale release candidate

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release.yml
  workflow_dispatch:
    inputs:
      candidate_tag:
        description: "Prerelease tag such as v0.2.0-rc.4"
        required: true
        default: "v0.2.0-rc.4"

permissions:
  contents: read

concurrency:
  group: microscale-rc-release
  cancel-in-progress: false

jobs:
  build:
    name: Package ${{ matrix.profile }} ${{ matrix.arch }}
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        profile: [small, micro, extreme]
        arch: [arm64, amd64]
    steps:
      - uses: actions/checkout@v4
      - name: Validate code and deploy guards
        run: |
          bash tests/test_profiles.sh
          bash tests/test_installer.sh
          bash tests/test_ram.sh
      - name: Install packer if needed
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils
          if [ "${{ matrix.profile }}" = extreme ]; then
            sudo apt-get install -y upx-ucl
          fi
      - name: Build pinned upstream for ARM64 (retry transient download failures)
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if TARGET_GOARCH=${{ matrix.arch }} bash scripts/build.sh "${{ matrix.profile }}"; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Build failed after 3 attempts" >&2
              exit 1
            fi
            echo "Build attempt $attempt failed; retrying transient upstream download failures..."
            sleep 15
          done
      - name: Verify ELF and checksums
        shell: bash
        run: |
          set -euo pipefail
          profile="${{ matrix.profile }}"
          arch="${{ matrix.arch }}"
          dir="dist/$profile/linux-$arch"
          bash scripts/verify.sh "$dir/microscale" "$arch"
          (cd "$dir"; sha256sum -c SHA256SUMS; sha256sum -c ARCHIVE.SHA256)
          grep -q "Feature qualification: NOT COMPLETE" "$dir/build-info.txt"
      - name: Prepare distinct release assets
        shell: bash
        run: |
          set -euo pipefail
          profile="${{ matrix.profile }}"
          arch="${{ matrix.arch }}"
          dir="dist/$profile/linux-$arch"
          mkdir -p release-assets
          cp "$dir/microscale-$profile-linux-$arch.tar.gz" release-assets/
          cp "$dir/ARCHIVE.SHA256" "release-assets/microscale-$profile-linux-$arch.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: rc-${{ matrix.profile }}-${{ matrix.arch }}
          path: release-assets/
          retention-days: 30
          if-no-files-found: error

  prerelease:
    name: Publish prerelease only
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_tag || 'v0.2.0-rc.4' }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: rc-*
          path: release-assets
          merge-multiple: true
      - name: Stage interactive binary-only installer
        shell: bash
        run: |
          set -euo pipefail
          sh -n scripts/install.sh
          sh -n scripts/ram-test.sh
          cp scripts/install.sh release-assets/install.sh
          sed -i "s|^RELEASE_TAG=.*|RELEASE_TAG=$TAG|" release-assets/install.sh
          cp scripts/ram-test.sh release-assets/ram-test.sh
          sed -i "s|^RELEASE_TAG=.*|RELEASE_TAG=$TAG|" release-assets/ram-test.sh
          chmod 644 release-assets/install.sh release-assets/ram-test.sh
          (cd release-assets && sha256sum install.sh > install.sh.sha256 && sha256sum ram-test.sh > ram-test.sh.sha256)
      - name: Validate candidate and download checksums
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]] || {
            echo "This workflow only permits -rc.N prerelease tags" >&2
            exit 1
          }
          cd release-assets
          sha256sum -c install.sh.sha256
          sha256sum -c ram-test.sh.sha256
          grep -Fx "RELEASE_TAG=$TAG" install.sh
          grep -Fx "RELEASE_TAG=$TAG" ram-test.sh
          for profile in small micro extreme; do
            for arch in arm64 amd64; do
              sha256sum -c "microscale-$profile-linux-$arch.tar.gz.sha256"
            done
          done
      - name: Write release notice
        shell: bash
        run: |
          cat > notes.md <<NOTES
          # MicroScale $TAG (prerelease)

          Tailscale v1.104.5 builds for Linux ARM64 and x86_64 (AMD64).
          Profiles: Small (full features), Micro (reduced), Extreme (reduced + UPX).
          Archives contain the upstream license, build metadata, and SHA256 checksums.

          ## RAM-only smoke tests (no installation to NAND)
          Download ram-test.sh from this release, verify ram-test.sh.sha256, then run:
          
          sh ram-test.sh all

          The test runs entirely in /tmp or /dev/shm tmpfs and produces a sanitized
          results.tsv file. It does not change Tailscale services, routes, DNS,
          Tailscale configuration, or persistent system executables.

          install.sh is also provided for optional persistent ARM64 installation;
          do not use install.sh for RAM-only testing.

          Micro/Extreme are not qualified for NR3053 VPN routing.
          CLI/daemon-version smoke tests do not prove Exit Node or reconnect.
          NOTES
      - name: Publish prerelease
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$TAG" >/dev/null 2>&1 && {
            echo "Refusing to overwrite existing release $TAG" >&2
            exit 1
          }
          gh release create "$TAG" release-assets/* \
            --target "$GITHUB_SHA" --prerelease \
            --title "MicroScale $TAG (not router-qualified)" \
            --notes-file notes.md

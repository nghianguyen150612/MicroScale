name: MicroScale stable release

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release.yml
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Stable release tag such as v0.2.1"
        required: true
        default: "v0.2.2"

permissions:
  contents: read

concurrency:
  group: microscale-stable-release
  cancel-in-progress: false

jobs:
  build:
    name: Package ${{ matrix.profile }} ${{ matrix.arch }}
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        profile: [small, micro, extreme]
        arch: [arm64, amd64]
    steps:
      - uses: actions/checkout@v4
      - name: Validate code and deploy guards
        run: |
          bash tests/test_profiles.sh
          bash tests/test_installer.sh
          bash tests/test_ram.sh
          bash tests/test_manager.sh
          bash tests/test_ram_stage.sh
          bash tests/test_device_reports.sh
      - name: Install packer if needed
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils
          if [ "${{ matrix.profile }}" = extreme ]; then
            sudo apt-get install -y upx-ucl
          fi
      - name: Build pinned upstream for ARM64 (retry transient download failures)
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if TARGET_GOARCH=${{ matrix.arch }} bash scripts/build.sh "${{ matrix.profile }}"; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Build failed after 3 attempts" >&2
              exit 1
            fi
            echo "Build attempt $attempt failed; retrying transient upstream download failures..."
            sleep 15
          done
      - name: Verify ELF and checksums
        shell: bash
        run: |
          set -euo pipefail
          profile="${{ matrix.profile }}"
          arch="${{ matrix.arch }}"
          dir="dist/$profile/linux-$arch"
          bash scripts/verify.sh "$dir/microscale" "$arch"
          (cd "$dir"; sha256sum -c SHA256SUMS; sha256sum -c ARCHIVE.SHA256)
          grep -q "Feature qualification:" "$dir/build-info.txt"
      - name: Verify reduced profile userspace runtime (native AMD64 only)
        if: matrix.arch == 'amd64' && matrix.profile != 'small'
        run: bash tests/test_router_runtime.sh "$(pwd)/dist/${{ matrix.profile }}/linux-amd64/microscale"

      - name: Prepare distinct release assets
        shell: bash
        run: |
          set -euo pipefail
          profile="${{ matrix.profile }}"
          arch="${{ matrix.arch }}"
          dir="dist/$profile/linux-$arch"
          mkdir -p release-assets
          cp "$dir/microscale-$profile-linux-$arch.tar.gz" release-assets/
          cp "$dir/ARCHIVE.SHA256" "release-assets/microscale-$profile-linux-$arch.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.profile }}-${{ matrix.arch }}
          path: release-assets/
          retention-days: 30
          if-no-files-found: error

  release:
    name: Publish stable release
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || 'v0.2.2' }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: release-assets
          merge-multiple: true
      - name: Stage interactive binary-only installer
        shell: bash
        run: |
          set -euo pipefail
          sh -n scripts/install.sh
          sh -n scripts/ram-test.sh
          sh -n scripts/manager.sh
          bash tests/test_manager.sh
          cp scripts/manager.sh release-assets/manager.sh
          cp scripts/install.sh release-assets/install.sh
          sed -i "s|^RELEASE_TAG=.*|RELEASE_TAG=$TAG|" release-assets/install.sh
          cp scripts/ram-test.sh release-assets/ram-test.sh
          sed -i "s|^RELEASE_TAG=.*|RELEASE_TAG=$TAG|" release-assets/ram-test.sh
          chmod 644 release-assets/install.sh release-assets/ram-test.sh
          (cd release-assets && sha256sum install.sh > install.sh.sha256 && sha256sum ram-test.sh > ram-test.sh.sha256 && sha256sum manager.sh > manager.sh.sha256)
      - name: Validate stable tag and checksums
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "This workflow only publishes stable semantic-version tags" >&2
            exit 1
          }
          cd release-assets
          sha256sum -c install.sh.sha256
          sha256sum -c ram-test.sh.sha256
          sha256sum -c manager.sh.sha256
          # Bootstrap and manager must use exactly the published version;
          # future tags require editing the reviewed source pin first.
          grep -Fx "RELEASE_TAG=$TAG" install.sh
          grep -Fx "TAG=$TAG" manager.sh
          pinned="$(sed -n 's/^engine_sha=//p' install.sh)"
          actual="$(sha256sum manager.sh | awk '{print $1}')"
          test "$pinned" = "$actual"
          grep -Fx "RELEASE_TAG=$TAG" ram-test.sh
          for profile in small micro extreme; do
            for arch in arm64 amd64; do
              sha256sum -c "microscale-$profile-linux-$arch.tar.gz.sha256"
            done
          done
      - name: Write release notice
        shell: bash
        run: |
          cat > notes.md <<NOTES
          # MicroScale $TAG

          ARM64 and x86_64 builds from pinned Tailscale v1.104.5.
          Profiles: Small (full), Micro (reduced), Extreme (UPX).

          The checksum-pinned OpenWrt installer now provides:
          - /usr/lib/microscale/manager.sh (executable lifecycle manager)
          - /usr/bin/microscale (short command symlink)
          - /etc/microscale (persistent install state and original binary backups)

          Manager supports install, update, repair, status, doctor, diagnostics,
          version, RAM staging, verified RAM-to-NAND apply, and uninstall/restore.
          The RAM stage uses /tmp/microscale-stage and does not install binaries
          into /usr or change the running Tailscale service. Prior RC5 installs
          using /var/lib/microscale require manual migration after saving backups.
          It **never** enables/starts/restarts Tailscale, changes DNS/firewall/routes,
          or alters Tailscale authentication and state.

          New shared RAM tester for physical devices and VMs writes sanitized
          latest.tsv results. An authenticated host can collect them over SSH
          and submit a reviewable GitHub PR; no tokens are stored on the router.

          Release assets: three profiles x ARM64/AMD64, SHA256 sidecars,
          install.sh, manager.sh and ram-test.sh, with checksums.
          The RAM tester remains the safe non-installation option on routers.

          ## Validation and support boundary
          This is the stable version of MicroScale's build packaging, SHA256 integrity
          checks, binary-only installer and RAM staging workflow. All six build targets
          and host-side smoke tests must pass before this release is published.

          Device-side validation remains limited to six CLI smoke tests on NR3053.
          Live login, Exit Node, Subnet Router, reconnect, 24/7 daemon operation,
          reboot persistence and NAND transaction recovery are NOT certified.
          Micro and Extreme use reduced/packed builds and remain experimental.
          Do not deploy to your only remote management path without local SSH and
          verified backups. The installer does not control the Tailscale service.
          NOTES
      - name: Publish stable release
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$TAG" >/dev/null 2>&1 && {
            echo "Refusing to overwrite existing release $TAG" >&2
            exit 1
          }
          gh release create "$TAG" release-assets/* \
            --target "$GITHUB_SHA" --latest \
            --title "MicroScale $TAG" \
            --notes-file notes.md

name: MicroScale release candidate

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release.yml
  workflow_dispatch:
    inputs:
      candidate_tag:
        description: "Prerelease tag such as v0.2.0-rc.2"
        required: true
        default: "v0.2.0-rc.2"

permissions:
  contents: read

concurrency:
  group: microscale-rc-release
  cancel-in-progress: false

jobs:
  build:
    name: Package ${{ matrix.profile }} ARM64
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        profile: [safe, small, extreme]
    steps:
      - uses: actions/checkout@v4
      - name: Validate code and deploy guards
        run: |
          bash tests/test_profiles.sh
          bash tests/test_deploy.sh
          bash tests/test_installer.sh
      - name: Install packer if needed
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils
          if [ "${{ matrix.profile }}" = extreme ]; then
            sudo apt-get install -y upx-ucl
          fi
      - name: Build pinned upstream for ARM64 (retry transient download failures)
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if TARGET_GOARCH=arm64 bash scripts/build.sh "${{ matrix.profile }}"; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Build failed after 3 attempts" >&2
              exit 1
            fi
            echo "Build attempt $attempt failed; retrying transient upstream download failures..."
            sleep 15
          done
      - name: Verify ELF and checksums
        shell: bash
        run: |
          set -euo pipefail
          profile="${{ matrix.profile }}"
          dir="dist/$profile/linux-arm64"
          bash scripts/verify.sh "$dir/microscale" arm64
          (cd "$dir"; sha256sum -c SHA256SUMS; sha256sum -c ARCHIVE.SHA256)
          grep -q "Feature qualification: NOT COMPLETE" "$dir/build-info.txt"
      - name: Prepare distinct release assets
        shell: bash
        run: |
          set -euo pipefail
          profile="${{ matrix.profile }}"
          dir="dist/$profile/linux-arm64"
          mkdir -p release-assets
          cp "$dir/microscale-$profile-linux-arm64.tar.gz" release-assets/
          cp "$dir/ARCHIVE.SHA256" "release-assets/microscale-$profile-linux-arm64.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: rc-${{ matrix.profile }}
          path: release-assets/
          retention-days: 30
          if-no-files-found: error

  prerelease:
    name: Publish prerelease only
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_tag || 'v0.2.0-rc.2' }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: rc-*
          path: release-assets
          merge-multiple: true
      - name: Stage interactive binary-only installer
        shell: bash
        run: |
          set -euo pipefail
          sh -n scripts/install.sh
          cp scripts/install.sh release-assets/install.sh
          sed -i "s|^RELEASE_TAG=.*|RELEASE_TAG=$TAG|" release-assets/install.sh
          chmod 644 release-assets/install.sh
          (cd release-assets && sha256sum install.sh > install.sh.sha256)
      - name: Validate candidate and download checksums
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]] || {
            echo "This workflow only permits -rc.N prerelease tags" >&2
            exit 1
          }
          cd release-assets
          sha256sum -c install.sh.sha256
          grep -Fx "RELEASE_TAG=$TAG" install.sh
          for profile in safe small extreme; do
            sha256sum -c "microscale-$profile-linux-arm64.tar.gz.sha256"
          done
      - name: Write release notice
        shell: bash
        run: |
          cat > notes.md <<NOTES
          # MicroScale $TAG (prerelease)

          Official upstream Tailscale v1.104.5 source, packaged in three ARM64 profiles:
          Safe (full), Small (reduced) and Extreme (reduced + UPX).
          Builds preserve the Tailscale license and SHA256 checksums.

          ## Interactive binary-only installer (SSH into your OpenWrt router)
          \`\`\`sh
          wget -O /tmp/microscale-install.sh https://github.com/$GH_REPO/releases/download/$TAG/install.sh && sh /tmp/microscale-install.sh
          \`\`\`

          The menu lets you pick a profile; installer only replaces the Tailscale executable paths.
          No Tailscale login, service start/restart, init configuration, DNS, firewall, routes,
          Wi-Fi, or persistent auth state is changed. An existing daemon continues running
          the old executable until the user restarts it manually.

          **Unqualified for NR3053.** CI smoke tests do not prove Exit Node, DNS,
          subnet routing, reconnect or Tailscale SSH. Small/Extreme omit features and
          must be evaluated before use. Keep direct local SSH recovery and a binary backup.
          This is a release candidate, not a stable production upgrade.
          NOTES
      - name: Publish prerelease
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$TAG" >/dev/null 2>&1 && {
            echo "Refusing to overwrite existing release $TAG" >&2
            exit 1
          }
          gh release create "$TAG" release-assets/* \
            --target "$GITHUB_SHA" --prerelease \
            --title "MicroScale $TAG (not router-qualified)" \
            --notes-file notes.md
